name: Backend CI

on:
  pull_request:
    paths:
      - 'api/**'
  push:
    branches: [main]
    paths:
      - 'api/**'

defaults:
  run:
    working-directory: api

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/api_test
      # Test-only secret — never used for a real deployment.
      JWT_SECRET: test-secret-for-ci-only
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npm run lint
      # No unit test files (*.spec.ts) exist yet — see req.md QA-2.
      - run: npm test -- --passWithNoTests
      - run: npx prisma migrate deploy
      # Prisma 7's WASM query compiler needs dynamic import(), which Jest's
      # CommonJS runner blocks without this flag.
      - run: npm run test:e2e
        env:
          NODE_OPTIONS: --experimental-vm-modules
      - run: npm run build
